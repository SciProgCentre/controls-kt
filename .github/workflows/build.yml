name: Gradle build

on:
  push:
    branches: [ dev, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: 'gradle'
      - name: Patch Chrome to allow root
        run: |
            sudo mv /usr/bin/google-chrome /usr/bin/google-chrome-real
            echo '#!/bin/bash' | sudo tee /usr/bin/google-chrome
            echo '/usr/bin/google-chrome-real --no-sandbox "$@"' | sudo tee -a /usr/bin/google-chrome
            sudo chmod +x /usr/bin/google-chrome
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }} # always run even if the previous step fails
        with:
          report_paths: '**/test-results/**/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          flaky_summary: true
          include_empty_in_summary: false
          skip_success_summary: true